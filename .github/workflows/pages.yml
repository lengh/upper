name: pages

# Builds static Linux binaries and publishes them, the installer and the
# download page to GitHub Pages. Runs on every push to the default branch.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

      - name: Build binaries
        run: |
          version="$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p _site/dl build
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o build/upper ./cmd/upper
            tar -czf "_site/dl/upper_linux_${arch}.tar.gz" -C build upper
          done
          (cd _site/dl && sha256sum *.tar.gz > SHA256SUMS)
          echo "$version" > _site/dl/VERSION

      - name: Assemble site
        run: |
          cp site/install.sh _site/install.sh
          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "s/{{DATE}}/$(date -u +%Y-%m-%d)/g" \
              -e "s/{{SHA_AMD64}}/$(grep amd64 _site/dl/SHA256SUMS | cut -d' ' -f1)/g" \
              -e "s/{{SHA_ARM64}}/$(grep arm64 _site/dl/SHA256SUMS | cut -d' ' -f1)/g" \
              site/index.html > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
